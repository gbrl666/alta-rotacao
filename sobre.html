<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sobre — Alta Rotação</title>
  <meta name="description" content="Quem escreve o Alta Rotação — diário público de opinião sobre música pop.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="discoball-wrap" title="psiu…"><div class="discoball"></div><small>clique 3x</small></div>

  <header class="masthead">
    <div class="wrap masthead-top">
      <span class="no-ar"><span class="bolinha"></span> No ar</span>
      <span id="dataHoje"></span>
      <span class="mast-links"><a href="sobre.html">Sobre</a> · <a href="admin.html">Escrever ✎</a></span>
    </div>
    <div class="wrap">
      <a href="index.html" class="logo">
        <h1>Alta Rotação</h1>
        <div class="tagline">Pop · Opinião · As divas que importam</div>
      </a>
    </div>
  </header>

  <main class="wrap"><article class="artigo" id="sobre"></article></main>

  <footer class="rodape">
    <div class="wrap">
      <span>© <span id="ano"></span> Alta Rotação</span>
      <span><a href="index.html">← Voltar pra capa</a></span>
    </div>
  </footer>

  <script src="sobre.js"></script>
  <script src="app.js"></script>
  <script src="fx.js"></script>
  <script>
    document.getElementById("ano").textContent = new Date().getFullYear();
    document.getElementById("dataHoje").textContent = dataBonita(new Date().toISOString().slice(0, 10));

    const s = window.SOBRE || {};
    document.getElementById("sobre").innerHTML = `
      <a href="index.html" class="voltar">← Alta Rotação</a>
      <div class="sobre-topo">
        <div class="capa sobre-foto">${s.foto || "♪"}</div>
        <div>
          <p class="chamada" style="margin-bottom:6px">${escapar(s.chamada || "Quem escreve")}</p>
          <h1 style="margin:0">${escapar(s.titulo || "Sobre")}</h1>
        </div>
      </div>
      <div class="corpo">${formatarCorpo(s.texto || "")}</div>
      <p style="margin-top:44px"><a href="index.html" class="voltar">← Ver os posts</a></p>
    `;
  </script>
</body>
</html>
